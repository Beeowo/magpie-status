name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: bun run build

      - name: Package the panel and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = "build/windows-amd64"
          if (-not (Test-Path $buildDir)) {
            throw "mygo build left no $buildDir"
          }
          $exe = Get-ChildItem $buildDir -Filter *.exe |
            Where-Object { $_.Name -notmatch "setup" } |
            Select-Object -First 1
          if (-not $exe) {
            throw "no application exe in $buildDir"
          }
          $setup = Get-ChildItem $buildDir -Filter *-setup-*.exe | Select-Object -First 1

          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "panel-stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage "magpie-panel.exe")
          $res = Join-Path $buildDir "resources"
          if (Test-Path $res) {
            Copy-Item $res (Join-Path $stage "resources") -Recurse
          }

          $zip = Join-Path (Resolve-Path dist) "magpie-panel-windows-amd64.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal
          if ($setup) {
            Copy-Item $setup.FullName (Join-Path "dist" $setup.Name)
          }

          Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path "dist" "SHA256SUMS") -Encoding ascii

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Magpie Panel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/dist/magpie-panel-windows-amd64.zip
            app/dist/SHA256SUMS
            app/dist/*-setup-*.exe
